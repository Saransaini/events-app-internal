name: Deploy Wagmate to GitHub Pages

# Builds the Expo app as a static website and publishes it to GitHub Pages.
# The app talks to Firebase directly from the browser, so there is no server
# to deploy alongside it — the contents of mobile/dist are the whole thing.

on:
  push:
    branches:
      - main
      - claude/tinder-dogs-app-plan-j5ki6s
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Export static web build
        working-directory: mobile
        env:
          # Pages serves this repo at /<repo-name>/, not at the domain root,
          # so asset URLs need that prefix. Derived from the repo name so a
          # rename or fork keeps working.
          WAGMATE_BASE_URL: /${{ github.event.repository.name }}

          # Same value, exposed to the app itself rather than just the
          # bundler. Google sign-in needs it to build a redirect URI that
          # points at the app's subpath instead of the domain root — see
          # src/hooks/useGoogleSignIn.ts.
          EXPO_PUBLIC_WAGMATE_BASE_URL: /${{ github.event.repository.name }}

          # Firebase web config is designed to be public — these values
          # identify the project, they do not grant access to it. Every
          # request is still authorised by firestore.rules, which is covered
          # by the tests in test/rules.test.js. They live here in plain sight
          # rather than in secrets because they are compiled into the
          # JavaScript bundle this workflow publishes either way.
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBsth3CKUxcTYMWZNTbC3FS0lbYAG9Vj34
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: tinder4dogs-46593.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: tinder4dogs-46593
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: tinder4dogs-46593.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "3345060430"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:3345060430:web:4a051c0aa4f820ca66a91f
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 3345060430-l40gsadi8s32bdbnjkuhsaao9sschf0t.apps.googleusercontent.com
        run: npx expo export --platform web

      - name: Prepare output for GitHub Pages
        working-directory: mobile
        run: |
          # Pages runs Jekyll by default, which silently drops directories
          # beginning with an underscore — including Expo's _expo/ bundle
          # directory, which would leave a blank page.
          touch dist/.nojekyll
          # The export is a single-page app: only index.html exists, and the
          # router resolves paths in the browser. Pages has no rewrite rule,
          # so a deep link like /discover would 404. Serving the same
          # document as 404.html lets the router pick those URLs up.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
